<script>
const LOCATION_ID = 'LBV57104VNB7X';

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + (Math.round((n || 0) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
const norm = s => String(s || '').toLowerCase().replace(/[’']/g, "'").replace(/\b(canvas|printed|needlepoint|kcn|designers?|the|stand up|series)\b/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;

function candPool() {

  const m = {};

}

const CAT_IDS = { minder: 'X2XPSG377FG4R7GGFTAB24N4', bars: 'VF2RSQCSDTEOG7ALC7KZ65NS', canvas: 'YVW4S5JTV7SEE4U6GR5EOQKB', halloween: 'ONQ75WTSAREAUA7TJZDYZQMT' };
const SUP_GROUPS = [
  ['thread', 'Threads & fibers', 'Thread lines list every color. Single thread buttons (like Milan or Very Velvet) are usually rung up without receiving stock, which is why many are below zero.'],
  ['minder', 'Needle minders', ''],
  ['frame', 'Frames, stretcher bars & tacks', ''],
  ['tool', 'Tools & notions', ''],
  ['book', 'Books & cards', ''],
  ['kit', 'Kits', ''],
  ['catchall', 'Register buttons', "Open-price buttons for ringing up things that aren't listed, like In Store Canvas. Their stock numbers don't mean anything. In Square you can turn off stock tracking for these so they stop showing below zero."],
  ['other', 'Other non-canvas', 'Low-priced items that didn\'t fit a group. Check whether any are really canvases.'],
];
const THREAD_RE = /\b(silk|velvet|milan|radiance|razzle|kreinik|krenick|wool|dmc|pepper|frye|eye ?lash|reflections|city needlework|essentials?|skeins?|bisous|ribbon|lam[eé]|caron|planet earth|cottage garden|vineyard|braid|floss|threads?)\b/i;
function classify(name, price, cats, multi) {
  const n = name.toLowerCase().trim();
  cats = cats || [];
  if (cats.includes(CAT_IDS.canvas) || cats.includes(CAT_IDS.halloween)) return 'canvas';
  if (/^(in[- ]?store canvas|canvas|adhoc|project|custom|misc\w*)$/.test(n) || (!price && !multi && /canvas|adhoc|custom/.test(n))) return 'catchall';
  if (cats.includes(CAT_IDS.minder) || /needle ?minder|corner minder/.test(n)) return /corner/.test(n) ? 'tool' : 'minder';
  if (cats.includes(CAT_IDS.bars) || /\bframes?\b|stretcher|tacks|featherlight/.test(n)) return 'frame';
  if (/kreinik|krenick/.test(n) || (THREAD_RE.test(n) && (multi || price <= 15) && !/mini|ornament|round|angel/.test(n))) return 'thread';
  if (/\bkit\b/.test(n)) return 'kit';
  if (/paperback|directory|needle ?point cards|^cards$/.test(n)) return /^cards$/.test(n) ? 'thread' : 'book';
  if (/tool|boogie board|scissors|snips|magnet|needles?\b|organizer|bag$/.test(n) && price < 30) return 'tool';

}

const REV_FILTERS = [['todo', 'Not checked'], ['dup', 'Possible duplicates'], ['nophoto', 'In stock, not in a photo'], ['low', 'Square says 0 or less'], ['done', 'Checked ✓'], ['price', 'Price changes'], ['archived', 'Archived in Square'], ['all', 'Everything']];
function viewReview(all) {

  const base = {
    price: x => x.r.newPrice != null,

  const test = { archived: x => x.r.archived };

  const f = S.revF || 'todo', words = norm(S.revQ || '').split(' ').filter(Boolean), k = skuNorm(S.revQ || '');

    ${f === 'nophoto' ? `<p class="small muted" style="margin-bottom:10px">Square says these are in stock, but they aren't in any of your photos. Find each one in the shop or back stock, or set it to 0 if it's gone.</p>` : ''}

function reviewHints(x) {

function viewSupplies(all) {

  const byVar = {}; for (const r of all) if (r.coll === 'counts') byVar[r.var] = r;
  const q = norm(S.supQ || ''), k = skuNorm(S.supQ || ''), f = S.supF || 'all';
  const keep = s => (!q || norm(s.name).includes(q) || (k.length >= 2 && skuNorm(s.sku).includes(k))) && (f === 'all' || (f === 'neg' ? s.qty != null && s.qty < 0 : (s.qty == null || s.qty === 0)));
  const G = {}; for (const [g] of SUP_GROUPS) G[g] = { items: [], lines: [] };
  for (const s of Object.values(S.square.byVar)) { if (s.archived) continue; const g = classify(s.name, s.price, s.cats, false); if (g !== 'canvas') G[g].items.push(s); }
  for (const L of S.square.lines || []) { const g = classify(L.name, L.vars[0] ? L.vars[0].price : 0, L.cats, true); if (g !== 'canvas') G[g].lines.push(L); }
  const units = arr => arr.reduce((a, x) => a + (x.qty > 0 ? x.qty : 0), 0);

  let totalItems = 0, totalUnits = 0, totalValue = 0;
  const cards = SUP_GROUPS.map(([g, title, help]) => {

    if (!items.length && !lines.length) return '';
    return `<div class="card">
      <div class="card-h"><h2>${esc(title)}</h2><span class="small muted">${G[g].items.length + G[g].lines.length} listing${G[g].items.length + G[g].lines.length === 1 ? '' : 's'} · ${units(flat)} in stock · ${money(value(flat))} retail${neg ? ` · <span style="color:var(--bad)">${neg} below zero</span>` : ''}</span></div>
      ${help ? `<p class="small muted">${esc(help)}</p>` : ''}

          ${open ? `<div class="table-wrap"><table><thead><tr><th>Color</th><th>SKU</th><th class="n">Price</th><th class="n">Square</th></tr></thead><tbody>${vars.map(v => `<tr><td>${esc(v.name)}</td><td>${esc(v.sku)}</td><td class="n">${money(v.price)}</td><td class="n" ${v.qty != null && v.qty <= 0 ? 'style="color:var(--bad);font-weight:700"' : ''}>${v.qty ?? '—'}</td></tr>`).join('')}</tbody></table></div>` : ''}
        </details>`; }).join('')}
      ${items.length ? `<div class="list">${items.map(s => rowHtml(byVar[s.var])).join('')}</div>` : ''}

    <div class="bar">

function priceReviewHtml(pv) {
  if (pv.state === 'reading') return `<div class="confirm"><p>Getting Square's current prices…</p></div>`;
  if (pv.state === 'error') return `<div class="confirm"><p>${esc(pv.msg)}</p><div class="acts"><button class="btn" type="button" id="priceCancel">Back</button></div></div>`;
  if (pv.state === 'done') return `<div class="confirm"><p><b>Prices updated in Square.</b> ${pv.done} item${pv.done === 1 ? '' : 's'} now ring up at the new price. Remember to change the stickers.</p><div class="acts"><button class="btn" type="button" id="priceCancel">Done</button></div></div>`;
  const ch = pv.items.filter(i => i.now !== i.to);
  return `<div class="confirm">

    <div class="table-wrap"><table><thead><tr><th>Item</th><th class="n">Square now</th><th class="n">Becomes</th></tr></thead><tbody>
      ${pv.items.map(i => `<tr><td>${esc(i.name)}</td><td class="n">${money(i.now)}</td><td class="n"><b>${i.now === i.to ? 'already ' + money(i.to) : money(i.to)}</b></td></tr>`).join('')}
    </tbody></table></div>
    <div class="acts">
      <button class="btn primary" type="button" id="priceGo" ${ch.length && pv.state !== 'writing' ? '' : 'disabled'}>${pv.state === 'writing' ? 'Updating…' : 'Update prices in Square'}</button>

async function startPriceReview() {
  if (!mcp) { toast(squareErrorCopy({ code: 'no_mcp' })); return; }
  const list = rows().filter(r => r.var && r.newPrice != null && r.newPrice !== r.price);
  S.prv = { state: 'reading' }; render();
  try {
    const objs = {};
    for (let i = 0; i < list.length; i += 500) {
      const p = await squareCall('catalog', 'batchGetobjects', { object_ids: list.slice(i, i + 500).map(r => r.var), include_related_objects: false });
      for (const o of p.objects || []) objs[o.id] = o;
    }
    const items = list.filter(r => objs[r.var]).map(r => { const o = objs[r.var], vd = o.item_variation_data || {};
      return { var: r.var, name: r.name, version: o.version, itemId: vd.item_id, now: ((vd.price_money || {}).amount || 0) / 100, to: Math.round(r.newPrice * 100) / 100 }; });
    S.prv = { state: 'ready', items };
  } catch (e) { S.prv = { state: 'error', msg: squareErrorCopy(e) }; }
  render();
}
async function pushPrices() {
  const pv = S.prv; if (!pv || pv.state !== 'ready') return;
  const ch = pv.items.filter(i => i.now !== i.to);
  pv.state = 'writing'; render();
  let done = 0;
  try {
    for (let i = 0; i < ch.length; i += 10) {
      const chunk = ch.slice(i, i + 10);
      await squareCall('catalog', 'batchUpdateObjects', {
        sparse_update: true,
        idempotency_key: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
        batches: [{ objects: chunk.map(x => ({ type: 'ITEM_VARIATION', id: x.var, version: x.version, item_variation_data: { item_id: x.itemId, pricing_type: 'FIXED_PRICING', price_money: { amount: Math.round(x.to * 100), currency: 'USD' } } })) }],
      }, true);
      done += chunk.length;
      for (const x of chunk) {
        if (S.square && S.square.byVar[x.var]) S.square.byVar[x.var].price = x.to;
        const d = { ...(S.counts[x.var] || {}) }; delete d.newPrice;
        delete d.stickerDone;
        saveDoc('counts', x.var, { ...d, price: x.to, priceChangedAt: new Date().toISOString(), priceWas: x.now, stickerTodo: true });
      }
    }
    S.prv = { state: 'done', done };
  } catch (e) {
    S.prv = { state: 'error', msg: (done ? `${done} price${done === 1 ? ' was' : 's were'} updated before Square stopped. ` : '') + squareErrorCopy(e) + ' Press Load from Square to see where things stand before trying again.' };
  }
  render();
}

  if (rv.state === 'done') return `<div class="confirm"><p><b>Square updated.</b> ${rv.done} item${rv.done === 1 ? '' : 's'} now match your count.</p><div class="acts"><button class="btn" type="button" id="reviewCancel">Done</button></div></div>`;
  const changes = rv.items.filter(i => i.now !== i.count);
  return `<div class="confirm">
    <p><b>Update ${changes.length} item${changes.length === 1 ? '' : 's'} in Square?</b> Square will set each one's stock at Sookie's Needlepoint LLC to your count.</p>
    <div class="table-wrap"><table><thead><tr><th>Canvas</th><th class="n">Square now</th><th class="n">Becomes</th></tr></thead><tbody>
      ${rv.items.map(i => `<tr><td>${esc(i.name)}</td><td class="n">${i.now ?? '—'}</td><td class="n"><b>${i.now === i.count ? 'already ' + i.count : i.count}</b></td></tr>`).join('')}
    </tbody></table></div>

      <button class="btn primary" type="button" id="reviewGo" ${changes.length && rv.state !== 'writing' ? '' : 'disabled'}>${rv.state === 'writing' ? 'Updating…' : 'Update Square'}</button>
      <button class="btn" type="button" id="reviewCancel" ${rv.state === 'writing' ? 'disabled' : ''}>Cancel</button>
    </div>
  </div>`;
}

/* ---------- actions ---------- */
function findRow(key) {
  const [coll, id] = key.split(':');
  return rows().find(r => r.coll === coll && r.id === id);
}
function setCount(key, n, extra = {}) {
  const r = findRow(key); if (!r) return;
  const base = r.doc ? { ...r.doc } : { name: r.name, price: r.price || 0 };
  if (r.var && r.sqQty != null) base.sq = r.sqQty;
  const data = { ...base, count: n == null ? null : Math.max(0, Math.round(n)), confirmed: true, countedAt: new Date().toISOString(), ...extra };
  saveDoc(r.coll, r.id, data);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, input[type=checkbox]'); if (!t) return;
  if (t.matches('#tabs button') || t.dataset.go) {
    S.tab = t.dataset.tab || t.dataset.go; pref.set('tab2', S.tab); S.review = null; render();
    const sel = document.querySelector('#tabs [aria-selected="true"]'); if (sel) sel.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    if (t.dataset.go) window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    return;
  }
  if (t.dataset.arf) { S.arF = t.dataset.arf; S.arN = 60; render(); return; }
  if (t.dataset.armore) { S.arN = (S.arN || 60) + 60; render(); return; }
  if (t.dataset.arsup) { S.arSup = t.checked; render(); return; }
  if (t.id === 'sqLoad' || t.dataset.act === 'load') { loadSquare(); return; }
  if (t.id === 'skuClear') { S.sku = ''; $('#skuQ').value = ''; $('#skuQ').focus(); render(); return; }
  if (t.dataset.ph) { S.ph = { i: Number(t.dataset.ph), sel: null, hide: S.ph.hide }; pref.set('ph', S.ph.i); render(); return; }
  if (t.dataset.tag) { S.ph.sel = Number(t.dataset.tag); render(); return; }
  if (t.dataset.linkstart) { S.linking = { key: t.dataset.linkstart, q: '' }; render(); const el = document.getElementById('lq-' + S.linking.key); if (el) el.focus(); return; }
  if (t.dataset.linkto) { doLink(t.dataset.linkto); return; }
  if (t.dataset.linkcancel) { S.linking = null; render(); return; }
  if (t.dataset.unlink) { const id = t.dataset.unlink, L = S.links[id]; if (L && L.note) saveDoc('links', id, { note: L.note }); else deleteDoc('links', id); toast('Unlinked. The count you made stays on the Square item.'); return; }
  if (t.dataset.verify) {
    const on = toggleVerify(t.dataset.verify);
    if (on && t.dataset.next && S.tab === 'photos' && S.ph.sel < PHOTOS[S.ph.i].tags.length - 1) { S.ph.sel++; render(); }
    toast(on ? 'Checked ✓ Square and photo match.' : 'Check mark removed.');
    return;
  }
  if (t.dataset.goto) {
    const [i, j] = t.dataset.goto.split('-').map(Number);
    S.tab = 'photos'; pref.set('tab2', 'photos'); S.ph = { i, sel: j, hide: S.ph.hide }; pref.set('ph', i); render();
    const ph = document.querySelector('.ph'); if (ph) ph.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    return;
  }
  if (t.dataset.revf) { S.revF = t.dataset.revf; S.revN = 100; render(); return; }
  if (t.dataset.revmore) { S.revN = (S.revN || 100) + 100; render(); return; }
  if (t.dataset.notdup) { const [a, b] = t.dataset.notdup.split('|'); markNotDup(a, b); toast('Marked as different canvases.'); return; }
  if (t.dataset.look) { S.tab = 'home'; pref.set('tab2', 'home'); S.sku = t.dataset.look; $('#skuQ').value = S.sku; render(); document.querySelector('.skufind').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  if (t.dataset.opensup) { S.tab = 'supplies'; S.supQ = t.dataset.opensup; render(); return; }
  if (t.id === 'priceReview') { startPriceReview(); return; }
  if (t.id === 'priceGo') { pushPrices(); return; }
  if (t.id === 'priceCancel') { S.prv = null; render(); return; }
  if (t.dataset.stickerdone) { const r = findRow(t.dataset.stickerdone); if (r && r.doc) { const d = { ...r.doc }; if (t.checked) d.stickerDone = new Date().toISOString(); else delete d.stickerDone; saveDoc(r.coll, r.id, d); } return; }
  if (t.dataset.clearprice) { const r = findRow(t.dataset.clearprice); if (r && r.doc) { const d = { ...r.doc }; delete d.newPrice; saveDoc(r.coll, r.id, d); } return; }
  if (t.dataset.supf) { S.supF = t.dataset.supf; render(); return; }
  if (t.dataset.hidetags) { S.ph.hide = !S.ph.hide; render(); return; }
  if (t.dataset.tagnav) { S.ph.sel = Math.max(0, Math.min(PHOTOS[S.ph.i].tags.length - 1, S.ph.sel + Number(t.dataset.tagnav))); render(); return; }
  if (t.dataset.tstep) { const x = photoTags(rows())[S.ph.sel]; const c = x && x.r ? x.r.count : null; countTag((c ?? (Number(t.dataset.tstep) > 0 ? 0 : 1)) + Number(t.dataset.tstep)); return; }
  if (t.dataset.tconfirm) { const x = photoTags(rows())[S.ph.sel]; countTag(x.r.count); return; }
  if (t.dataset.copy) { const v = t.dataset.copy; navigator.clipboard.writeText(v).then(() => toast(`Copied ${v}. Paste it into Square's item search.`), () => toast(`SKU ${v}. Type it into Square's item search.`)); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; pref.set('filter', S.filter); render(); return; }
  if (t.dataset.step) { const r = findRow(t.dataset.key); setCount(t.dataset.key, (r.count ?? (Number(t.dataset.step) > 0 ? 0 : 1)) + Number(t.dataset.step)); return; }
  if (t.dataset.confirm) { const r = findRow(t.dataset.confirm); setCount(t.dataset.confirm, r.count); return; }
  if (t.id === 'confirmAll') { for (const r of rows().filter(r => r.status === 'photo')) setCount(r.coll + ':' + r.id, r.count); toast('Confirmed. Any that differ from Square are on the To-do tab.'); return; }
  if (t.dataset.remove) { const [coll, id] = t.dataset.remove.split(':'); deleteDoc(coll, id); return; }
  if (t.dataset.countit) { const s = S.square.byVar[t.dataset.countit]; S.tab = 'count'; S.filter = 'all'; S.spot = 'all'; S.q = s.name; render(); return; }
  if (t.id === 'csv') { exportCsv(); return; }
  if (t.id === 'offAll') { for (const c of document.querySelectorAll('[data-pick]')) c.checked = t.checked; return; }
  if (t.id === 'review') { startReview(); return; }
  if (t.id === 'reviewGo') { pushToSquare(); return; }
  if (t.id === 'reviewCancel') { S.review = null; render(); return; }
  if (t.id === 'readPhotos') { readPhotos(); return; }
  if (t.dataset.res) { S.photo.results[Number(t.dataset.res)].keep = t.checked; render(); return; }
  if (t.id === 'saveRes') { saveResults(); return; }
  if (t.id === 'dropRes') { S.photo.results = null; render(); return; }
  if (t.id === 'mAdd') { manualAdd(); return; }
});

document.addEventListener('input', e => {

  if (t.id === 'skuQ') { S.sku = t.value; render(); }

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'spot') { S.spot = t.value; pref.set('spot', S.spot); render(); }
  else if (t.dataset.newprice) {

    const v = t.value === '' ? null : Math.round(Number(t.value) * 100) / 100;

  else if (t.dataset.tagnote) { const id = t.dataset.tagnote; saveDoc('links', id, { ...(S.links[id] || {}), note: t.value.slice(0, 300) }); }
  else if (t.dataset.tcount) countTag(t.value === '' ? null : Number(t.value));
  else if (t.matches('.stepper input')) setCount(t.dataset.key, t.value === '' ? null : Number(t.value));
  else if (t.dataset.spotset) { const r = findRow(t.dataset.spotset); saveDoc(r.coll, r.id, { ...(r.doc || { name: r.name, price: r.price || 0, sq: r.sqQty }), spot: t.value }); }
  else if (t.dataset.noteset) { const r = findRow(t.dataset.noteset); saveDoc(r.coll, r.id, { ...(r.doc || { name: r.name, price: r.price || 0, sq: r.sqQty }), note: t.value.slice(0, 200) }); }
  else if (t.id === 'photoSpot') S.photo.spot = t.value;
  else if (t.dataset.rescount) S.photo.results[Number(t.dataset.rescount)].count = Math.max(0, Number(t.value) || 0);
  else if (t.id === 'photos') {
    for (const f of S.photo.files) URL.revokeObjectURL(f.url);
    S.photo.files = [...t.files].slice(0, 5).map(f => ({ file: f, url: URL.createObjectURL(f) }));
    S.photo.err = t.files.length > 5 ? 'Only the first 5 photos are read at a time.' : ''; render();
  }
});

async function startReview() {
  const ids = [...document.querySelectorAll('[data-pick]:checked')].map(c => c.dataset.pick);
  if (!ids.length) { toast('Tick at least one item.'); return; }
  if (!mcp) { toast(squareErrorCopy({ code: 'no_mcp' })); return; }
  const all = rows();
  const items = ids.map(id => all.find(r => r.coll === 'counts' && r.id === id)).filter(Boolean).map(r => ({ var: r.var, name: r.name, count: r.count, now: null }));
  S.review = { state: 'reading', items }; render();
  try {
    const now = {};
    for (let i = 0; i < items.length; i += 500) {
      const p = await squareCall('inventory', 'batchGetcounts', { catalog_object_ids: items.slice(i, i + 500).map(x => x.var), location_ids: [LOCATION_ID], states: ['IN_STOCK'], limit: 1000 });
      for (const c of p.counts || []) now[c.catalog_object_id] = Number(c.quantity);
    }
    for (const x of items) x.now = x.var in now ? now[x.var] : 0;
    S.review = { state: 'ready', items };
  } catch (e) { S.review = { state: 'error', msg: squareErrorCopy(e) }; }
  render();
}
async function pushToSquare() {
  const rv = S.review; if (!rv || rv.state !== 'ready') return;
  const changes = rv.items.filter(i => i.now !== i.count);
  rv.state = 'writing'; render();
  const when = new Date().toISOString(); let done = 0;
  try {
    for (let i = 0; i < changes.length; i += 100) {
      const chunk = changes.slice(i, i + 100);
      await squareCall('inventory', 'batchChange', {
        idempotency_key: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
        changes: chunk.map(x => ({ type: 'PHYSICAL_COUNT', physical_count: { catalog_object_id: x.var, state: 'IN_STOCK', location_id: LOCATION_ID, quantity: String(x.count), occurred_at: when } })),
        ignore_unchanged_counts: true,
      }, true);
      done += chunk.length;
      for (const x of chunk) {
        if (S.square && S.square.byVar[x.var]) S.square.byVar[x.var].qty = x.count;
        const d = S.counts[x.var]; if (d) saveDoc('counts', x.var, { ...d, sq: x.count, pushedAt: when });
      }
    }
    S.review = { state: 'done', done };
  } catch (e) {
    S.review = { state: 'error', msg: (done ? `${done} item${done === 1 ? ' was' : 's were'} updated before Square stopped. ` : '') + squareErrorCopy(e) + ' Press Load from Square to see where things stand before trying again.' };
  }
  render();
}

async function readPhotos() {
  const P = S.photo; if (!P.files.length || P.busy) return;
  P.busy = true; P.err = ''; P.results = null; render();
  const names = S.square ? Object.values(S.square.byVar).map(s => s.name) : Object.values(S.counts).map(c => c.name);
  const prompt = `These photos show hand-painted needlepoint canvases for sale at Sookie's Needlepoint, a needlepoint shop. Each canvas is in a white sleeve with a pink border. Many have a small sticker with the canvas name, mesh count (13 or 18) and price, and a designer mark or code printed in a lower corner (for example Penny Linn, KCD1933 for KCN Designers, KDS-95, SCT, CMC, MD-54, LDD, MN).

List every distinct canvas you can see. Count how many copies of the same design are visible. Then pick the matching listing from the shop's Square item names below, or null if none fits. Only match when you are fairly sure.

Square item names:
${names.slice(0, 1500).join('\n')}

Reply with only a JSON array, one object per canvas:
[{"name": "short descriptive name, using the sticker name if readable", "maker": "designer or code if visible, else empty", "mesh": "13 or 18 or empty", "price": number or null, "count": number, "square": "exact Square item name or null"}]`;
  try {
    const out = await sample.json(prompt, { images: P.files.map(f => f.file), cache: false });
    const byName = {}; if (S.square) for (const s of Object.values(S.square.byVar)) byName[s.name] = s;
    P.results = (Array.isArray(out) ? out : []).filter(o => o && o.name).slice(0, 80).map(o => {
      const m = o.square && (byName[o.square] || Object.values(byName).find(s => norm(s.name) === norm(o.square)));
      return { name: String(o.name).slice(0, 120), maker: String(o.maker || '').slice(0, 60), mesh: String(o.mesh || ''), price: Number(o.price) || (m ? m.price : 0), count: Math.max(1, Math.round(Number(o.count) || 1)), match: m || null, keep: true };
    });
  } catch (e) {
    P.err = ({ not_granted: 'Reading photos needs your OK. Allow Claude for this page and try again.', images_unavailable: "Photos can't be sent from this view.", image_rejected: 'That photo could not be read. Try a JPG or PNG under 20 MB.', rate_limited: "You've hit a usage limit. Wait a bit and try again.", invalid_json: 'The answer came back in the wrong shape. Press Read canvases again.', refused: 'Claude declined that photo. Try a different one.' })[e && e.code] || 'Reading the photos failed. Try again in a moment.';
  }
  P.busy = false; render();
}
function saveResults() {
  const P = S.photo; let n = 0;
  for (const r of P.results.filter(x => x.keep)) {
    if (r.match) {
      const prev = S.counts[r.match.var];
      saveDoc('counts', r.match.var, { ...(prev || {}), name: r.match.name, price: r.match.price, sq: r.match.qty, count: (prev && prev.count != null ? prev.count : 0) + r.count, confirmed: false, photo: true, spot: (prev && prev.spot) || P.spot, maker: r.maker });
    } else {
      saveDoc('extras', 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), { name: r.name, maker: r.maker + (r.mesh ? ` · ${r.mesh} mesh` : ''), price: r.price || 0, count: r.count, spot: P.spot, photo: true, confirmed: true });
    }
    n++;
  }
  P.results = null; S.tab = 'count'; S.filter = 'photo'; render();
  toast(`Added ${n}. Confirm each count on the wall.`);
}
function manualAdd() {
  const name = $('#mName').value.trim(); if (!name) { toast('Type a canvas name first.'); return; }
  const count = Math.max(0, Number($('#mCount').value) || 0), spot = $('#mSpot').value, maker = $('#mMaker').value.trim(), price = Number($('#mPrice').value) || 0;
  const s = S.square && Object.values(S.square.byVar).find(x => x.name.toLowerCase() === name.toLowerCase());
  if (s) saveDoc('counts', s.var, { ...(S.counts[s.var] || {}), name: s.name, price: s.price, sq: s.qty, count, confirmed: true, spot, maker, countedAt: new Date().toISOString() });
  else saveDoc('extras', 'x' + Date.now().toString(36), { name, maker, price, count, spot, confirmed: true });
  toast(s ? `Counted ${count} of ${s.name}.` : `Added ${name}. It's on the To-do list until it's listed.`);
  for (const id of ['mName', 'mMaker', 'mPrice']) $('#' + id).value = '';
}
async function exportCsv() {
  const all = rows().filter(r => r.doc);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['Canvas', 'Designer', 'Spot', 'Price', 'New price', 'My count', 'Square count', 'Status', 'Note'].join(',')]
    .concat(all.map(r => [r.name, r.maker, r.spot, r.price || '', r.newPrice ?? '', r.count ?? '', r.sqQty ?? '', STATUS[r.status][1], r.note].map(q).join(',')));
  const data = lines.join('\n');
  if (downloads) {
    try { await downloads.save({ filename: `canvas-count-${new Date().toISOString().slice(0, 10)}.csv`, data }); toast('Saved.'); return; }
    catch (e) { if (e && e.code === 'cancelled') return; }
  }
  try { await navigator.clipboard.writeText(data); toast('Copied the spreadsheet. Paste it into Numbers, Excel or Google Sheets.'); }
  catch (e) { toast("Couldn't save or copy here."); }
}

/* ---------- boot ---------- */
render();
(async () => {
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  [db, mcp, sample, downloads] = await Promise.all([use('db'), use('mcp'), use('sample'), use('downloads')]);
  if (db) {
    S.dbMode = 'db';
    const waiting = new Set(['counts', 'extras', 'links']);
    for (const c of ['counts', 'extras', 'links']) {
      db.collection(c).onSnapshot(snap => {
        const target = {};
        for (const d of snap.docs) if (d.exists) target[d.id] = JSON.parse(JSON.stringify(d.data()));
        S[c] = target;
        waiting.delete(c); S.dbReady = waiting.size === 0; render();
      }, () => toast('Lost the connection to your saved counts. Reload the page to reconnect.'));
    }
  } else {
    S.dbMode = 'local';
    try { const d = JSON.parse(localStorage.getItem('cc-data') || '{}'); S.counts = d.counts || {}; S.extras = d.extras || {}; S.links = d.links || {}; } catch (e) {}
    S.dbReady = true; render();
  }
  if (sample) { try { const lim = await sample.limits(); if (!lim.images) sample = null; } catch (e) { sample = null; } render(); }
  if (!S.square) {
    try {
      const snap = await (await fetch('catalog.json')).json();
      if (!S.square) {   // a live load may have finished meanwhile
        const byVar = {};
        for (const [v, item, name, sku, price, qty, cats, arch] of snap.items) byVar[v] = { var: v, item, name, sku, price, qty, cats, archived: !!arch, track: true, desc: '' };
        const lines = snap.lines.map(([item, name, cats, vars]) => ({ item, name, cats, vars: vars.map(([v, n, sku, price, qty]) => ({ var: v, name: n, sku, price, qty })) }));
        S.square = { byVar, lines, loadedAt: new Date(snap.asOf + 'T12:00:00'), threadItems: lines.length, dups: buildDups(byVar), snapshot: true };
        const when = S.square.loadedAt.toLocaleDateString([], { month: 'short', day: 'numeric' });
        setSq('Saved copy', `Everything in Square as of ${when}. ${mcp ? 'Press Load from Square for live numbers.' : 'Live numbers work when this page is open on claude.ai.'}`, 'info');
        render();
      }
    } catch (e) { if (!mcp) setSq('Square not loaded', 'Square can be reached when this page is open on claude.ai.', 'none'); }
  }
})();
</script>
