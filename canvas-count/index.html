<style>
/* Layout: a header cut from pink-and-white shop wall, then a counting list that reads like the price labels on the canvases. */
:root {
  --bg: #FBF6F8;
  --surface: #FFFFFF;
  --surface-2: #F6ECF0;
  --ink: #2A1B22;
  --ink-2: #5C4651;
  --muted: #8A7480;
  --line: #EBDCE3;
  --stripe: #F7D9E5;
  --accent: #C2185B;
  --accent-soft: #FCE4EE;
  --on-accent: #FFFFFF;
  --label: #BFE8C7;
  --label-ink: #1F4D2B;
  --good: #2E7D4F; --good-soft: #DDF1E4;
  --warn: #9A6200; --warn-soft: #FBEBC8;
  --bad: #B3261E; --bad-soft: #F9DEDC;
  --shadow: 0 1px 2px rgba(42,27,34,.06), 0 4px 16px rgba(42,27,34,.05);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #171114; --surface: #201a1d; --surface-2: #2a2125; --ink: #F3E8ED; --ink-2: #C9B6BF; --muted: #9C8891;
    --line: #3a2e34; --stripe: #2c1f25; --accent: #F06C9B; --accent-soft: #3d1b29; --on-accent: #22070F;
    --label: #24432c; --label-ink: #BFE8C7;
    --good: #62C28B; --good-soft: #173526; --warn: #E5AA45; --warn-soft: #3A2C10; --bad: #F27B72; --bad-soft: #3E1A18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171114; --surface: #201a1d; --surface-2: #2a2125; --ink: #F3E8ED; --ink-2: #C9B6BF; --muted: #9C8891;
  --line: #3a2e34; --stripe: #2c1f25; --accent: #F06C9B; --accent-soft: #3d1b29; --on-accent: #22070F;
  --label: #24432c; --label-ink: #BFE8C7;
  --good: #62C28B; --good-soft: #173526; --warn: #E5AA45; --warn-soft: #3A2C10; --bad: #F27B72; --bad-soft: #3E1A18;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(30px, 5vw, 42px); line-height: 1.02; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

header.top { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-block: 26px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: repeating-linear-gradient(90deg, var(--stripe) 0 38px, var(--bg) 38px 76px); border-bottom: 2px dashed var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; }
.titlecard { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px 16px; box-shadow: var(--shadow); display: grid; gap: 4px;
  border-image: repeating-linear-gradient(45deg, var(--accent) 0 6px, var(--surface) 6px 12px) 6; border-width: 6px; border-style: solid; }
.titlecard p { color: var(--ink-2); }
.sqbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; box-shadow: var(--shadow); max-width: 100%; }
.sqbox .msg { font-size: 13px; color: var(--ink-2); min-width: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; margin-top: 20px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.tile strong { font-family: var(--display); font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile.alert strong { color: var(--bad); }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; margin: 22px 0 16px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-size: 12px; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.bar input[type=search], .bar select, .field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.bar input[type=search] { flex: 1 1 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.list { display: grid; gap: 8px; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 2px 2px; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 13px; color: var(--muted); align-items: center; margin-top: 2px; }
.row .right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 4px; background: var(--label); color: var(--label-ink); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.none { background: var(--surface-2); color: var(--muted); }
.sqq { display: grid; justify-items: end; font-size: 12px; color: var(--muted); line-height: 1.2; }
.sqq b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.stepper button { border: 0; background: none; width: 34px; height: 34px; cursor: pointer; font-size: 18px; font-weight: 700; color: var(--ink-2); }
.stepper button:hover { background: var(--accent-soft); color: var(--accent); }
.stepper input { width: 44px; text-align: center; border: 0; background: var(--surface); height: 34px; font-weight: 700; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.row details { grid-column: 1 / -1; font-size: 13px; }
.row details summary { cursor: pointer; color: var(--muted); }
.row .edit { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 14px; }
.card > * + * { margin-top: 10px; }
.card-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.confirm { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.confirm .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { border: 2px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); align-items: end; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.drop { border: 2px dashed var(--accent); border-radius: 14px; padding: 18px; display: grid; gap: 10px; justify-items: start; background: var(--accent-soft); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); z-index: 20; }
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .progress div { transition: none; } }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } .row .right { justify-content: space-between; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="titlecard">
      <span class="label">Sookie's Needlepoint · Katy</span>
      <h1>Canvas Count</h1>
      <p>Count what's on the walls, then fix Square to match.</p>
    </div>
    <div class="sqbox" aria-live="polite">
      <span class="pill none" id="sqPill">Square not loaded</span>
      <span class="msg" id="sqMsg">Showing the counts saved here.</span>
      <button class="btn primary small" id="sqLoad" type="button">Load from Square</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="tiles" id="tiles" aria-label="Summary"></section>
  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs">
    <button role="tab" data-tab="count" type="button">Count</button>
    <button role="tab" data-tab="fix" type="button">Fix in Square</button>
    <button role="tab" data-tab="add" type="button">Add from photo</button>
  </nav>
  <section id="view"></section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const LOCATION_ID = 'LBV57104VNB7X';
const SPOTS = ['Christmas wall', 'Pink wall', 'Charm display', 'New arrivals table', 'Back stock', 'Other'];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + (Math.round((n || 0) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
const norm = s => String(s || '').toLowerCase().replace(/[’']/g, "'").replace(/\b(canvas|printed|needlepoint|kcn|designers?|the|stand up|series)\b/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 4200);
}
const pref = {
  get(k, d) { try { return localStorage.getItem('cc-' + k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cc-' + k, v); } catch (e) {} }
};

/* ---------- state ---------- */
const S = {
  tab: pref.get('tab', 'count'),
  q: '', spot: pref.get('spot', 'all'), filter: pref.get('filter', 'mine'),
  counts: {}, extras: {}, dbReady: false, dbMode: 'none',
  square: null,           // { byVar: {varId: {...}}, loadedAt }
  sqState: 'idle',        // idle | loading | ready | error
  review: null,           // pending Square update preview
  photo: { files: [], spot: 'Christmas wall', results: null, busy: false, err: '' },
};
let db = null, mcp = null, sample = null, downloads = null;

/* ---------- storage ---------- */
const writeTimers = {};
function saveDoc(coll, id, data) {
  if (coll === 'counts') S.counts[id] = data; else S.extras[id] = data;
  render();
  if (S.dbMode === 'local') { try { localStorage.setItem('cc-data', JSON.stringify({ counts: S.counts, extras: S.extras })); } catch (e) {} return; }
  if (!db) return;
  clearTimeout(writeTimers[coll + id]);
  writeTimers[coll + id] = setTimeout(() => {
    db.collection(coll).doc(id).set(data).catch(e => toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Remove old extras to make room.' : "Couldn't save that change. Check your connection and try again."));
  }, 500);
}
function deleteDoc(coll, id) {
  if (coll === 'counts') delete S.counts[id]; else delete S.extras[id];
  render();
  if (S.dbMode === 'local') { try { localStorage.setItem('cc-data', JSON.stringify({ counts: S.counts, extras: S.extras })); } catch (e) {} return; }
  if (db) db.collection(coll).doc(id).delete().catch(() => toast("Couldn't remove that. Try again."));
}

/* ---------- Square ---------- */
async function squareCall(service, method, request, write) {
  if (!mcp) throw { code: 'no_mcp' };
  const r = await mcp.callTool('Square', write ? 'make_api_request' : 'make_api_request_read',
    { service, method, request, characterization: write ? 'inventory physical count update' : 'inventory count review' }, write ? { cache: false } : undefined);
  const p = r.payload;
  if (typeof p === 'string') throw { code: 'tool_error', message: p.slice(0, 200) };
  if (p && p.error) throw { code: 'tool_error', message: ((p.details && p.details.square_errors) || []).map(e => e.detail || e.code).join('; ') || String(p.error) };
  if (p && p.errors && p.errors.length) throw { code: 'tool_error', message: p.errors.map(e => e.detail || e.code).join('; ') };
  return p || {};
}
function squareErrorCopy(e) {
  return ({
    no_mcp: "Square can only be reached when this page is open on claude.ai.",
    server_not_connected: "Square isn't connected for you here. Add it in claude.ai Settings → Connectors, then load again.",
    needs_reauth: "Your Square connection expired. Reconnect it in claude.ai Settings → Connectors.",
    not_in_manifest: "Square is turned off for this page. Turn it on from the page's Permissions menu.",
    approval_required: "Square needs your OK first. Press Load from Square and choose Allow.",
    selection_required: "You have more than one Square connection. Pick one when claude.ai asks, then load again.",
    server_unavailable: "Square didn't answer. Wait a moment and try again.",
    blocked_by_policy: "Your organization blocks this Square tool here.",
    tool_error: "Square said: " + ((e && e.message) || 'the request failed') + '.',
  })[e && e.code] || ("Something went wrong talking to Square" + (e && e.message ? ': ' + e.message : '.'));
}
async function loadSquare() {
  if (S.sqState === 'loading') return;
  S.sqState = 'loading'; setSq('Loading…', 'Reading your items from Square…', 'info'); render();
  try {
    const items = []; let cursor = '';
    for (let i = 0; i < 25; i++) {
      const p = await squareCall('catalog', 'searchItems', cursor ? { limit: 100, cursor } : { limit: 100 });
      items.push(...(p.items || []));
      setSq('Loading…', `Read ${items.length} items…`, 'info');
      cursor = p.cursor; if (!cursor) break;
    }
    const qty = {}; cursor = '';
    for (let i = 0; i < 25; i++) {
      const p = await squareCall('inventory', 'batchGetcounts', cursor ? { location_ids: [LOCATION_ID], states: ['IN_STOCK'], limit: 1000, cursor } : { location_ids: [LOCATION_ID], states: ['IN_STOCK'], limit: 1000 });
      for (const c of p.counts || []) qty[c.catalog_object_id] = Number(c.quantity);
      cursor = p.cursor; if (!cursor) break;
    }
    const byVar = {}; let threadItems = 0;
    for (const it of items) {
      const d = it.item_data || {}; const vars = d.variations || [];
      if (d.is_archived) continue;
      if (vars.length !== 1) { threadItems++; continue; }   // thread colors and multi-size items are skipped for now
      const v = vars[0], vd = v.item_variation_data || {};
      byVar[v.id] = { var: v.id, item: it.id, name: (d.name || '').trim(), price: ((vd.price_money || {}).amount || 0) / 100,
        sku: vd.sku || '', qty: v.id in qty ? qty[v.id] : null, track: vd.track_inventory !== false, desc: (d.description_plaintext || '').slice(0, 80) };
    }
    S.square = { byVar, loadedAt: new Date(), threadItems };
    S.sqState = 'ready';
    setSq('Square loaded', `${Object.keys(byVar).length} items, as of ${S.square.loadedAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}. Thread colors are left out.`, 'good');
  } catch (e) {
    S.sqState = 'error'; setSq('Square not loaded', squareErrorCopy(e), 'bad');
  }
  render();
}
function setSq(pill, msg, kind) {
  const p = $('#sqPill'); p.textContent = pill; p.className = 'pill ' + (kind || 'none');
  $('#sqMsg').textContent = msg;
  $('#sqLoad').textContent = S.sqState === 'ready' ? 'Reload' : 'Load from Square';
  $('#sqLoad').disabled = S.sqState === 'loading';
}

/* ---------- model ---------- */
function rows() {
  const out = [];
  const sqv = S.square ? S.square.byVar : {};
  const seen = new Set();
  for (const [id, c] of Object.entries(S.counts)) {
    const s = sqv[id];
    out.push(mk({ id, coll: 'counts', var: id, name: s ? s.name : c.name, price: s ? s.price : c.price, sqQty: s ? s.qty : c.sq, sqLive: !!s, doc: c }));
    seen.add(id);
  }
  for (const [id, x] of Object.entries(S.extras)) out.push(mk({ id, coll: 'extras', var: null, name: x.name, price: x.price, sqQty: null, doc: x }));
  for (const [id, s] of Object.entries(sqv)) if (!seen.has(id)) out.push(mk({ id, coll: 'counts', var: id, name: s.name, price: s.price, sqQty: s.qty, sqLive: true, doc: null }));
  return out;
}
function mk(r) {
  const d = r.doc || {};
  r.spot = d.spot || ''; r.count = d.count ?? null; r.confirmed = !!d.confirmed; r.photo = !!d.photo; r.note = d.note || ''; r.maker = d.maker || '';
  if (!r.var) r.status = 'missing';
  else if (r.count != null && !r.confirmed) r.status = 'photo';
  else if (r.count != null && r.sqQty != null && r.count !== r.sqQty) r.status = 'off';
  else if (r.count != null && r.sqQty == null) r.status = 'off';
  else if (r.count != null) r.status = 'ok';
  else r.status = 'todo';
  return r;
}
function stats(all) {
  const mine = all.filter(r => r.count != null);
  const counted = mine.filter(r => r.confirmed || r.coll === 'extras');
  return {
    units: counted.reduce((a, r) => a + r.count, 0),
    value: counted.reduce((a, r) => a + r.count * (r.price || 0), 0),
    photo: all.filter(r => r.status === 'photo').length,
    off: all.filter(r => r.status === 'off').length,
    missing: all.filter(r => r.status === 'missing').length,
    neg: S.square ? Object.values(S.square.byVar).filter(s => s.qty != null && s.qty < 0).length : null,
  };
}
function dupGroups() {
  if (!S.square) return [];
  const g = {};
  for (const s of Object.values(S.square.byVar)) { const k = norm(s.name); if (k) (g[k] = g[k] || []).push(s); }
  return Object.values(g).filter(a => a.length > 1);
}

/* ---------- render ---------- */
function render() {
  const all = rows(); const st = stats(all);
  $('#tiles').innerHTML = [
    tile('Canvases counted', st.units, 'confirmed on the floor'),
    tile('Retail value counted', money(st.value), 'at the price in Square'),
    tile('Seen in photos', st.photo, 'waiting for you to confirm'),

/* ---------- actions ---------- */
function findRow(key) {
  const [coll, id] = key.split(':');
  return rows().find(r => r.coll === coll && r.id === id);
}
function setCount(key, n, extra = {}) {
  const r = findRow(key); if (!r) return;
  const base = r.doc ? { ...r.doc } : { name: r.name, price: r.price || 0 };
  if (r.var && r.sqQty != null) base.sq = r.sqQty;
  const data = { ...base, count: n == null ? null : Math.max(0, Math.round(n)), confirmed: true, countedAt: new Date().toISOString(), ...extra };
  saveDoc(r.coll, r.id, data);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, input[type=checkbox]'); if (!t) return;
  if (t.matches('#tabs button')) { S.tab = t.dataset.tab; pref.set('tab', S.tab); S.review = null; render(); return; }
  if (t.id === 'sqLoad' || t.dataset.act === 'load') { loadSquare(); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; pref.set('filter', S.filter); render(); return; }
  if (t.dataset.step) { const r = findRow(t.dataset.key); setCount(t.dataset.key, (r.count ?? (Number(t.dataset.step) > 0 ? 0 : 1)) + Number(t.dataset.step)); return; }
  if (t.dataset.confirm) { const r = findRow(t.dataset.confirm); setCount(t.dataset.confirm, r.count); return; }
  if (t.id === 'confirmAll') { for (const r of rows().filter(r => r.status === 'photo')) setCount(r.coll + ':' + r.id, r.count); toast('Confirmed. Any that differ from Square are on the Fix in Square tab.'); return; }
  if (t.dataset.remove) { const [coll, id] = t.dataset.remove.split(':'); deleteDoc(coll, id); return; }
  if (t.dataset.countit) { const s = S.square.byVar[t.dataset.countit]; S.tab = 'count'; S.filter = 'all'; S.spot = 'all'; S.q = s.name; render(); return; }
  if (t.id === 'csv') { exportCsv(); return; }
  if (t.id === 'offAll') { for (const c of document.querySelectorAll('[data-pick]')) c.checked = t.checked; return; }
  if (t.id === 'review') { startReview(); return; }
  if (t.id === 'reviewGo') { pushToSquare(); return; }
  if (t.id === 'reviewCancel') { S.review = null; render(); return; }
  if (t.id === 'readPhotos') { readPhotos(); return; }
  if (t.dataset.res) { S.photo.results[Number(t.dataset.res)].keep = t.checked; render(); return; }
  if (t.id === 'saveRes') { saveResults(); return; }
  if (t.id === 'dropRes') { S.photo.results = null; render(); return; }
  if (t.id === 'mAdd') { manualAdd(); return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'spot') { S.spot = t.value; pref.set('spot', S.spot); render(); }
  else if (t.matches('.stepper input')) setCount(t.dataset.key, t.value === '' ? null : Number(t.value));
  else if (t.dataset.spotset) { const r = findRow(t.dataset.spotset); saveDoc(r.coll, r.id, { ...(r.doc || { name: r.name, price: r.price || 0, sq: r.sqQty }), spot: t.value }); }
  else if (t.dataset.noteset) { const r = findRow(t.dataset.noteset); saveDoc(r.coll, r.id, { ...(r.doc || { name: r.name, price: r.price || 0, sq: r.sqQty }), note: t.value.slice(0, 200) }); }
  else if (t.id === 'photoSpot') S.photo.spot = t.value;
  else if (t.dataset.rescount) S.photo.results[Number(t.dataset.rescount)].count = Math.max(0, Number(t.value) || 0);
  else if (t.id === 'photos') {
    for (const f of S.photo.files) URL.revokeObjectURL(f.url);

async function startReview() {
  const ids = [...document.querySelectorAll('[data-pick]:checked')].map(c => c.dataset.pick);
  if (!ids.length) { toast('Tick at least one item.'); return; }
  if (!mcp) { toast(squareErrorCopy({ code: 'no_mcp' })); return; }
  const all = rows();
  const items = ids.map(id => all.find(r => r.coll === 'counts' && r.id === id)).filter(Boolean).map(r => ({ var: r.var, name: r.name, count: r.count, now: null }));
  S.review = { state: 'reading', items }; render();
  try {
    const now = {};
    for (let i = 0; i < items.length; i += 500) {
      const p = await squareCall('inventory', 'batchGetcounts', { catalog_object_ids: items.slice(i, i + 500).map(x => x.var), location_ids: [LOCATION_ID], states: ['IN_STOCK'], limit: 1000 });
      for (const c of p.counts || []) now[c.catalog_object_id] = Number(c.quantity);
    }
    for (const x of items) x.now = x.var in now ? now[x.var] : 0;
    S.review = { state: 'ready', items };
  } catch (e) { S.review = { state: 'error', msg: squareErrorCopy(e) }; }
  render();
}
async function pushToSquare() {
  const rv = S.review; if (!rv || rv.state !== 'ready') return;
  const changes = rv.items.filter(i => i.now !== i.count);
  rv.state = 'writing'; render();
  const when = new Date().toISOString(); let done = 0;
  try {
    for (let i = 0; i < changes.length; i += 100) {
      const chunk = changes.slice(i, i + 100);
      await squareCall('inventory', 'batchChange', {
        idempotency_key: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
        changes: chunk.map(x => ({ type: 'PHYSICAL_COUNT', physical_count: { catalog_object_id: x.var, state: 'IN_STOCK', location_id: LOCATION_ID, quantity: String(x.count), occurred_at: when } })),
        ignore_unchanged_counts: true,
      }, true);
      done += chunk.length;
      for (const x of chunk) {
        if (S.square && S.square.byVar[x.var]) S.square.byVar[x.var].qty = x.count;
        const d = S.counts[x.var]; if (d) saveDoc('counts', x.var, { ...d, sq: x.count, pushedAt: when });
      }
    }
    S.review = { state: 'done', done };
  } catch (e) {
    S.review = { state: 'error', msg: (done ? `${done} item${done === 1 ? ' was' : 's were'} updated before Square stopped. ` : '') + squareErrorCopy(e) + ' Press Load from Square to see where things stand before trying again.' };
  }
  render();
}

async function readPhotos() {
  const P = S.photo; if (!P.files.length || P.busy) return;
  P.busy = true; P.err = ''; P.results = null; render();
  const names = S.square ? Object.values(S.square.byVar).map(s => s.name) : Object.values(S.counts).map(c => c.name);
  const prompt = `These photos show hand-painted needlepoint canvases for sale at Sookie's Needlepoint, a needlepoint shop. Each canvas is in a white sleeve with a pink border. Many have a small sticker with the canvas name, mesh count (13 or 18) and price, and a designer mark or code printed in a lower corner (for example Penny Linn, KCD1933 for KCN Designers, KDS-95, SCT, CMC, MD-54, LDD, MN).

List every distinct canvas you can see. Count how many copies of the same design are visible. Then pick the matching listing from the shop's Square item names below, or null if none fits. Only match when you are fairly sure.

Square item names:
${names.slice(0, 1500).join('\n')}

Reply with only a JSON array, one object per canvas:
[{"name": "short descriptive name, using the sticker name if readable", "maker": "designer or code if visible, else empty", "mesh": "13 or 18 or empty", "price": number or null, "count": number, "square": "exact Square item name or null"}]`;
  try {
    const out = await sample.json(prompt, { images: P.files.map(f => f.file), cache: false });
    const byName = {}; if (S.square) for (const s of Object.values(S.square.byVar)) byName[s.name] = s;
    P.results = (Array.isArray(out) ? out : []).filter(o => o && o.name).slice(0, 80).map(o => {
      const m = o.square && (byName[o.square] || Object.values(byName).find(s => norm(s.name) === norm(o.square)));
      return { name: String(o.name).slice(0, 120), maker: String(o.maker || '').slice(0, 60), mesh: String(o.mesh || ''), price: Number(o.price) || (m ? m.price : 0), count: Math.max(1, Math.round(Number(o.count) || 1)), match: m || null, keep: true };
    });
  } catch (e) {
    P.err = ({ not_granted: 'Reading photos needs your OK. Allow Claude for this page and try again.', images_unavailable: "Photos can't be sent from this view.", image_rejected: 'That photo could not be read. Try a JPG or PNG under 20 MB.', rate_limited: "You've hit a usage limit. Wait a bit and try again.", invalid_json: 'The answer came back in the wrong shape. Press Read canvases again.', refused: 'Claude declined that photo. Try a different one.' })[e && e.code] || 'Reading the photos failed. Try again in a moment.';
  }
  P.busy = false; render();
}
function saveResults() {
  const P = S.photo; let n = 0;
  for (const r of P.results.filter(x => x.keep)) {
    if (r.match) {
      const prev = S.counts[r.match.var];
      saveDoc('counts', r.match.var, { ...(prev || {}), name: r.match.name, price: r.match.price, sq: r.match.qty, count: (prev && prev.count != null ? prev.count : 0) + r.count, confirmed: false, photo: true, spot: (prev && prev.spot) || P.spot, maker: r.maker });
    } else {
      saveDoc('extras', 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), { name: r.name, maker: r.maker + (r.mesh ? ` · ${r.mesh} mesh` : ''), price: r.price || 0, count: r.count, spot: P.spot, photo: true, confirmed: true });
    }
    n++;
  }
  P.results = null; S.tab = 'count'; S.filter = 'photo'; render();
  toast(`Added ${n}. Confirm each count on the wall.`);
}
function manualAdd() {
  const name = $('#mName').value.trim(); if (!name) { toast('Type a canvas name first.'); return; }
  const count = Math.max(0, Number($('#mCount').value) || 0), spot = $('#mSpot').value, maker = $('#mMaker').value.trim(), price = Number($('#mPrice').value) || 0;
  const s = S.square && Object.values(S.square.byVar).find(x => x.name.toLowerCase() === name.toLowerCase());
  if (s) saveDoc('counts', s.var, { ...(S.counts[s.var] || {}), name: s.name, price: s.price, sq: s.qty, count, confirmed: true, spot, maker, countedAt: new Date().toISOString() });
  else saveDoc('extras', 'x' + Date.now().toString(36), { name, maker, price, count, spot, confirmed: true });
  toast(s ? `Counted ${count} of ${s.name}.` : `Added ${name}. It's on the Fix in Square list until it's listed.`);
  for (const id of ['mName', 'mMaker', 'mPrice']) $('#' + id).value = '';
}
async function exportCsv() {
  const all = rows().filter(r => r.doc);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['Canvas', 'Designer', 'Spot', 'Price', 'My count', 'Square count', 'Status', 'Note'].join(',')]
    .concat(all.map(r => [r.name, r.maker, r.spot, r.price || '', r.count ?? '', r.sqQty ?? '', STATUS[r.status][1], r.note].map(q).join(',')));
  const data = lines.join('\n');
  if (downloads) {
    try { await downloads.save({ filename: `canvas-count-${new Date().toISOString().slice(0, 10)}.csv`, data }); toast('Saved.'); return; }
    catch (e) { if (e && e.code === 'cancelled') return; }
  }
  try { await navigator.clipboard.writeText(data); toast('Copied the spreadsheet. Paste it into Numbers, Excel or Google Sheets.'); }
  catch (e) { toast("Couldn't save or copy here."); }
}

/* ---------- boot ---------- */
render();
(async () => {
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  [db, mcp, sample, downloads] = await Promise.all([use('db'), use('mcp'), use('sample'), use('downloads')]);
  if (db) {
    S.dbMode = 'db';
    const waiting = new Set(['counts', 'extras']);
    for (const c of ['counts', 'extras']) {
      db.collection(c).onSnapshot(snap => {
        const target = {};
        for (const d of snap.docs) if (d.exists) target[d.id] = JSON.parse(JSON.stringify(d.data()));
        if (c === 'counts') S.counts = target; else S.extras = target;
        waiting.delete(c); S.dbReady = waiting.size === 0; render();
      }, () => toast('Lost the connection to your saved counts. Reload the page to reconnect.'));
    }
  } else {
    S.dbMode = 'local';
    try { const d = JSON.parse(localStorage.getItem('cc-data') || '{}'); S.counts = d.counts || {}; S.extras = d.extras || {}; } catch (e) {}
    S.dbReady = true; render();
  }
  if (sample) { try { const lim = await sample.limits(); if (!lim.images) sample = null; } catch (e) { sample = null; } render(); }
  if (!mcp) setSq('Square not loaded', 'Square can be reached when this page is open on claude.ai.', 'none');
})();
</script>
